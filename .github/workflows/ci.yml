name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - logic
  push:
    branches:
      - dev
      - main
      - logic

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore ./backend/OneSake.sln

      - name: Build backend
        run: dotnet build ./backend/OneSake.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test ./backend/OneSake.Tests/OneSake.Tests.csproj -c Release --no-build

      # Bots play 200 matches with a fixed seed and the checked-in fixture decks.
      # Any invariant violation fails the build (see docs/simulation-findings.md).
      - name: Simulation smoke
        run: >
          dotnet run --project ./backend/OneSake.Simulator -c Release --no-build --
          --games 200 --seed 1 --bots random,greedy --decks meta,random --parallel 2 --out sim-failures

      - name: Upload simulation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-failures-smoke
          path: sim-failures
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: ./frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
